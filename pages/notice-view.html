      <p id="msg" class="msg" hidden></p>

  <script src="/api/config"></script>
  <script src="../js/vendor/supabase-2.117.2.js"></script>
  <script src="../js/db.js"></script>
  <script src="../js/main.js"></script>
  <script>
    (async () => {
      const msg = document.getElementById("msg");
      if (!DB.ready) return DB.message(msg, DB.notReadyText(), "info");
      const id = new URLSearchParams(location.search).get("id");
      const { data } = await DB.client.from("notices").select("*").eq("id", id).maybeSingle();
      if (!data) return DB.message(msg, "공지를 찾을 수 없습니다.", "error");
      document.title = data.title + " | 사단법인 한국 오픈이노베이션 협회";
      document.getElementById("notice").innerHTML =
        `<p><span class="badge">${DB.esc(data.category)}</span> <span style="color:var(--muted)">${DB.kdate(data.published_at, false)}</span></p>
         <h2 style="margin:8px 0 16px">${DB.esc(data.title)}</h2>
         <div class="notice-body">${DB.esc(data.body)}</div>`;
    })();
  </script>
</body>
