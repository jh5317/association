<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>비밀번호 재설정 | 사단법인 한국 오픈이노베이션 협회</title>
  <link rel="icon" type="image/png" href="../images/favicon.png">
  <link rel="apple-touch-icon" href="../images/apple-touch-icon.png">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="util-bar">
    <div class="container" id="auth-links">
      <a href="../pages/login.html">로그인</a>
      <a href="../pages/signup.html">회원가입</a>
    </div>
  </div>
  <header class="site-header">
    <div class="container">
      <a href="../index.html" class="logo"><img src="../images/logo.png" alt="(사)한국 오픈이노베이션 협회 KOIF" width="138" height="46"></a>
      <button class="menu-toggle" aria-label="메뉴 열기">☰</button>
      <nav class="nav">
        <ul>
          <li><a href="../pages/about.html">법인소개</a></li>
          <li><a href="../pages/certificate.html">자격안내</a></li>
          <li><a href="../pages/verify.html">자격조회</a></li>
          <li><a href="../pages/education.html">교육안내</a></li>
          <li><a href="../pages/notice.html">공지사항</a></li>
          <li><a href="../pages/contact.html">오시는 길</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <section class="page-title"><div class="container"><h1>비밀번호 재설정</h1></div></section>
  <main class="section">
    <div class="container auth-box">
      <p id="msg" class="msg" hidden></p>
      <form id="reset-form" class="form">
        <label>새 비밀번호 (8자 이상)<input type="password" name="password" minlength="8" required autocomplete="new-password"></label>
        <button class="btn btn-primary" type="submit">변경하기</button>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <img class="footer-logo" src="../images/logo-white.png" alt="KOIF 한국오픈이노베이션협회" width="150" height="50">
      <p><strong>사단법인 한국 오픈이노베이션 협회</strong></p>
      <p>대표자: 박재홍 | 고유번호: 0000000</p>
      <p>주소: 서울 광화문 | 전화: 02-3290-4411 | 이메일: luckiest@korea.ac.kr</p>
      <p class="footer-links"><a href="../pages/privacy.html"><strong>개인정보처리방침</strong></a><a href="../pages/donate.html">후원안내</a></p>
      <p>&copy; 2026 사단법인 한국 오픈이노베이션 협회. All rights reserved.</p>
    </div>
  </footer>
  <script src="/api/config"></script>
  <script src="../js/vendor/supabase-2.117.2.js"></script>
  <script src="../js/db.js"></script>
  <script src="../js/main.js"></script>
  <script>
    const msg = document.getElementById("msg");
    const form = document.getElementById("reset-form");
    if (!DB.ready) DB.message(msg, DB.notReadyText(), "info");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!DB.ready) return;
      const { error } = await DB.client.auth.updateUser({ password: form.password.value });
      if (error) return DB.message(msg, "변경하지 못했습니다. 메일의 링크를 다시 눌러 주세요.", "error");
      form.hidden = true;
      DB.message(msg, "비밀번호를 변경했습니다.", "ok");
    });
  </script>
</body>
</html>
